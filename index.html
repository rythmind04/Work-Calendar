<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14243c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Смены">
  <meta name="description" content="Календарь рабочих смен и общих выходных">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script>
    try {
      const scope = new URL("./", location.href).pathname;
      if (localStorage.getItem("smeny-theme:" + scope) === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {
      // The theme can still be switched for this session.
    }
  </script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" type="module"></script>
  <title>Смены</title>
</head>
<body>
  <header class="top">
    <div class="shell brand">
      <img src="./icons/icon-192.png" alt="" width="52" height="52">
      <div><h1>Смены</h1><p>Календарь рабочих графиков</p></div>
      <div class="header-actions">
        <span class="offline" id="offline" hidden>Доступно офлайн</span>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Тёмная тема" aria-pressed="false" title="Переключить тему">
          <svg class="moon" aria-hidden="true" viewBox="0 0 24 24"><path d="M20.9 13.35A8.7 8.7 0 0 1 10.65 3.1 9 9 0 1 0 20.9 13.35Z"/></svg>
          <svg class="sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main class="shell workspace">
    <aside class="card sidebar" aria-labelledby="profiles-title">
      <h2 id="profiles-title">Графики</h2>
      <div class="profiles" id="profiles"></div>
      <button class="add" id="add" type="button">＋ Новый график</button>
      <section class="compare" aria-labelledby="compare-title">
        <h2 id="compare-title">Общие выходные</h2>
        <label for="partner">С кем сравнить</label>
        <select id="partner"></select>
        <button class="primary" id="compare" type="button">Показать даты</button>
        <p id="compare-hint" class="hint"></p>
      </section>
    </aside>

    <section class="card calendar" aria-labelledby="month-title">
      <div class="calendar-top">
        <div>
          <p id="active-label" class="active-label">Календарь</p>
          <h2 id="month-title"></h2>
        </div>
        <div class="navigation">
          <button class="arrow" id="prev" type="button" aria-label="Предыдущий месяц">‹</button>
          <button id="today" type="button">Сегодня</button>
          <button class="arrow" id="next" type="button" aria-label="Следующий месяц">›</button>
        </div>
      </div>
      <div class="week" aria-hidden="true"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span></div>
      <div class="days" id="days"></div>
      <div class="legend" id="legend" hidden>
        <span><i class="work-key"></i> Смена</span>
        <span><i class="off-key"></i> Выходной</span>
        <span><i class="manual-key"></i> Ручная правка</span>
        <span id="shared-key" hidden><i class="shared-key"></i> Общий выходной</span>
      </div>
      <p class="hint calendar-hint" id="calendar-hint"></p>
      <section id="results" class="results" hidden aria-labelledby="results-title">
        <div class="results-head"><h3 id="results-title">Общие выходные</h3><button id="clear" type="button">Скрыть</button></div>
        <p id="results-summary"></p>
        <ul id="results-dates"></ul>
      </section>
    </section>
    <p id="status" class="status" role="status"></p>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="profile-form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button id="close" type="button" aria-label="Закрыть">×</button></div>
      <label for="name">Название графика</label>
      <input id="name" maxlength="36" required placeholder="Например, Мой график">
      <label for="pattern">Цикл смен</label>
      <select id="pattern"><option value="2">2/2</option><option value="3">3/3</option><option value="4">4/4</option><option value="5">5/2 (пн–пт)</option></select>
      <label id="start-label" for="start">Первый рабочий день цикла</label>
      <input id="start" type="date" min="0001-01-01" max="9999-12-31" required>
      <p class="hint" id="start-hint">С этой даты начнётся блок рабочих дней.</p>
      <div class="dialog-actions"><button id="remove" class="danger" type="button" hidden>Удалить</button><button class="primary" type="submit">Сохранить</button></div>
    </form>
  </dialog>
</body>
</html>
